# .github/workflows/security-sca.yml: the known vulnerabilities of the Composer packages, as a PDF report
name: Security (SCA)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Every Monday: new advisories are published for packages that did not change
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Japanese fonts for a Japanese report
      - run: sudo apt-get install -y fonts-noto-cjk

      - name: Audit the Composer packages
        run: vendor/bin/security-sca --pdf=tmp/security-sca.pdf --fail-on=high --language=ja

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: tmp/security-sca.pdf
          archive: false
          retention-days: 30
